[project]
name = "mcpdoctor"
version = "0.1.0"
description = "AI-usability linter for MCP servers + self-healing MCP chatbot"
requires-python = ">=3.12,<3.13"
dependencies = [
    "groq>=0.13.0",
    "jsonschema>=4",
    "mcp[cli]>=1.8.0",
    "python-dotenv>=1.1.0",
    "typer>=0.12.0",
    "rich>=13.0.0",
]

[project.scripts]
mcpdoctor = "mcpdoctor.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]
docs = [
    "mkdocs-material>=9.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcpdoctor"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-m 'not live'"
markers = [
    "live: talks to real external servers (npx download) - run with -m live",
]
