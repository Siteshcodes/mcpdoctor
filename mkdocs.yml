site_name: MCPDoctor
site_description: AI-usability linter and self-healing chatbot for MCP servers
site_url: https://siteshcodes.github.io/mcp-doctor/
repo_url: https://github.com/Siteshcodes/mcp-doctor
repo_name: Siteshcodes/mcp-doctor
edit_uri: edit/main/docs/

theme:
  name: material
  custom_dir: docs/overrides
  logo: assets/logo.svg
  favicon: assets/logo.svg
  font: false
  language: en
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.highlight
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to light mode

markdown_extensions:
  - admonition
  - attr_list
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Get started:
      - Installation: getting-started/installation.md
      - First lint: getting-started/first-lint.md
      - Troubleshooting: getting-started/troubleshooting.md
  - Use mcpdoctor:
      - CLI reference: usage/cli.md
      - Self-healing chat: usage/chat.md
      - Reports: usage/reports.md
      - Example reports:
          - Bad server: reports/badserver.md
          - Document server: reports/document-server.md
          - Filesystem server: reports/filesystem.md
          - Other server: reports/otherserver.md
  - Understand the checks:
      - Overview: checks/overview.md
      - Full check specification: mcpdoctor-check-spec.md
      - Probe safety: checks/probe-safety.md
  - Contribute:
      - Development: contributing/development.md
      - Architecture: contributing/architecture.md
      - Deployment: contributing/deployment.md
      - Roadmap: contributing/roadmap.md

extra_css:
  - assets/styles.css
extra_javascript:
  - assets/site.js
exclude_docs: |
  overrides/
copyright: Copyright &copy; 2026 Sitesh Gupta · MIT License
extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/Siteshcodes/mcp-doctor
      name: MCPDoctor on GitHub
